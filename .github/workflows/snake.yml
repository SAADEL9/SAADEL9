name: Update contribution snake

on:
  schedule:
    - cron: "0 3 * * *"        # every day at 03:00 UTC
  workflow_dispatch:            # manual run from the Actions tab
  push:
    paths:
      - scripts/generate_snake.py
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate snake from live contributions
        env:
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/generate_snake.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake-dark.svg snake-light.svg
          git diff --staged --quiet || git commit -m "chore: update contribution snake"
          git push
